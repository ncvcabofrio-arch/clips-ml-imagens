# Copie para config.yaml e ajuste:  cp config.example.yaml config.yaml

# Viagens de ida e volta. Para cada dia de ida, o robô faz uma busca de
# IDA E VOLTA (como no site) com a volta X dias depois.
viagens:
  - nome: Rio → Orlando
    origem: GIG
    destino: MCO
    ida_de: 2027-01-15         # primeiro dia possível de ida
    ida_ate: 2027-03-05        # último dia de ida (volta até 15/03)
    dias_de_viagem: [10]       # ex.: [9, 10, 11] testa 3x mais buscas
    modo: ida_e_volta          # ida_e_volta (busca RT) | separado (cada trecho como só ida)
    cabine: economica          # economica | executiva | qualquer
    max_paradas: 2             # 0 = só voo direto
    max_milhas_total: 280000   # alerta quando IDA + VOLTA (por pessoa) for <= isso

# Rotas só de ida (opcional). Exemplo:
# rotas:
#   - origem: GRU
#     destino: MIA
#     data_inicio: 2027-04-10
#     data_fim: 2027-04-20
#     cabine: Economy
#     max_milhas: 150000

adultos: 1

# Para o comando --melhores (monta as opções com os dados já coletados)
milhas_disponiveis: 585000
passageiros: 4
melhores_dias: [9, 10, 11]
evitar_periodos:                    # viagens que encostem nesses dias são descartadas
  - [2027-03-06, 2027-03-10]        # Carnaval 2027 (sábado a Quarta de Cinzas)
folga_horas_rapido: 2               # "meio-termo": até 2h a mais que o voo mais rápido do dia

# Comportamento do robô (seja gentil para não ser bloqueado)
espera_entre_buscas_seg: [60, 120]  # pausa aleatória entre buscas
max_buscas_por_rodada: 10           # cada execução busca no máx. isso; a próxima continua de onde parou
revalidar_horas: 20                 # um par de datas só é buscado de novo depois disso
validade_preco_horas: 72            # preços mais velhos que isso não entram no ranking
pausa_bloqueio_horas: 3             # se a LATAM bloquear, para tudo por esse tempo
timeout_busca_seg: 60
headless: false        # false = abre janela (Mac) / tela virtual xvfb (VPS)
proxy: ""              # opcional: "http://usuario:senha@host:porta"

# Alertas no Telegram (veja README para criar o bot)
telegram:
  token: ""
  chat_id: ""

resumo_telegram: true        # manda as 5 melhores combinações a cada varredura
realertar_se_baixar: true    # avisa de novo o mesmo par se o preço cair
